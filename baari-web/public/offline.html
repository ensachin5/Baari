<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A2540">
  <title>Baari — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #FFFFFF;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background-color: #0A2540;
      color: #FFFFFF;
      font-size: 36px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 4px 12px rgba(10, 37, 64, 0.15);
    }
    h1 {
      font-size: 24px;
      line-height: 30px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 20px;
      color: #5C5F66;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background-color: #0A2540;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #061729;
    }
    .btn:active {
      background-color: #061729;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">B</div>
    <h1>You're offline</h1>
    <p>Please check your internet connection and try reloading the page.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
